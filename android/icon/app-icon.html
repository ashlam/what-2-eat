<!doctype html>
<html><head><meta charset="utf-8"/>
<style>html,body{margin:0;padding:0;width:192px;height:192px;overflow:hidden;background:#2E4A3A}
svg{display:block;width:192px;height:192px}</style></head>
<body>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3A5A46"/>
      <stop offset="1" stop-color="#25392D"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#EDE7D8"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" fill="url(#bg)"/>

  <!-- 冰箱主体 -->
  <rect x="46" y="20" width="100" height="152" rx="18" fill="url(#body)"/>
  <!-- 门缝 -->
  <rect x="46" y="90" width="100" height="4.5" fill="#D8D0BE"/>
  <!-- 把手 -->
  <rect x="126" y="40" width="7" height="30" rx="3.5" fill="#D08A3E"/>
  <rect x="126" y="108" width="7" height="34" rx="3.5" fill="#D08A3E"/>

  <!-- 冷藏层里的一点内容：番茄 + 绿叶菜 -->
  <circle cx="72" cy="60" r="10.5" fill="#C9533F"/>
  <circle cx="72" cy="60" r="10.5" fill="none" stroke="#A8402F" stroke-width="1.6"/>
  <path d="M72 51 q5 -4 9 -3" stroke="#5C8A4A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M94 70 q7 -21 23 -16 q-2 16 -23 16 z" fill="#6E9B52"/>
  <path d="M94 70 q12 -9 23 -16" stroke="#547B3C" stroke-width="1.6" fill="none"/>
  <!-- 冷冻层：冰块 -->
  <rect x="62" y="108" width="21" height="21" rx="6" fill="#BFD9DC"/>
  <rect x="90" y="118" width="16" height="16" rx="4.5" fill="#CFE4E6"/>
</svg>
</body></html>
